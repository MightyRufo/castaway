worker_processes  1;  # nginx-rtmp requires single worker: stream state is per-worker, push relay + /stat only work correctly with 1.
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

events {
    worker_connections 1024;
}

# ----------------------------------------------------------------------------
# RTMP — single-stream model.
#   live  : OBS publishes to rtmp://host:1935/live/<STREAM_KEY>. Auth + relay.
#   show  : private (127.0.0.1 only). HLS is generated here at fixed name(s).
# ----------------------------------------------------------------------------
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        ping 30s;
        # POST so the stream key lives in the request body, not a URL query
        # string — keeps the secret out of any access log.
        notify_method post;

        # OBS connects here. The key is validated, then the stream is pushed
        # to /show/stream where HLS gets generated. No transcode — viewers
        # see exactly what OBS publishes.
        application live {
            live on;
            record off;

            include /etc/nginx/conf.d/rtmp-auth.conf;
            include /etc/nginx/conf.d/live-relay.conf;

            # Viewers go through /show; /live is publish-only.
            deny play all;
        }

        # Internal application — receives the relayed stream and produces HLS.
        # Only the local push relay is allowed to publish here.
        application show {
            live on;
            record off;

            include /etc/nginx/conf.d/show-hls.conf;

            allow publish 127.0.0.1;
            deny publish all;
            allow play all;
        }
    }
}

# ----------------------------------------------------------------------------
# HTTP — player UI, HLS delivery, login, health.
# ----------------------------------------------------------------------------
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Critical when behind a port mapping (Unraid host port != container port)
    # or a reverse proxy / Cloudflare Tunnel. Without this nginx 302s to
    # http://<host>:8080/ instead of preserving the public host:port.
    absolute_redirect off;
    port_in_redirect off;

    # Auth cookie -> $authed (1 = ok, 0 = redirect to /login.html).
    include /etc/nginx/conf.d/http-auth-map.conf;

    server {
        listen 8080 default_server;
        server_name _;

        access_log /var/log/nginx/access.log;

        # Always-open: docker healthcheck.
        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Always-open: /login.html, /icon.svg, /auth/login, /auth/logout.
        # entrypoint writes this when VIEWER_PASSWORD is set; empty otherwise
        # (in which case those paths fall through to the catch-all `location /`).
        include /etc/nginx/conf.d/http-login-route.conf;

        # Auth-protected: /api/config (JSON the player reads for the title).
        location = /api/config {
            include /etc/nginx/conf.d/http-auth-check.conf;
            include /etc/nginx/conf.d/http-config.conf;
        }

        # Auth-protected: HLS playlists + segments. Same-origin only — no CORS.
        location /hls/ {
            include /etc/nginx/conf.d/http-auth-check.conf;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var/lib/nginx;
            add_header Cache-Control no-cache;
        }

        # Loopback-only: nginx-rtmp stat XML. The admin server pulls this
        # from inside the container and republishes a sanitised view via
        # /api/state. Not exposed externally — no auth check needed.
        location /stat {
            allow 127.0.0.1;
            deny all;
            rtmp_stat all;
            access_log off;
            add_header Cache-Control no-cache;
        }

        # Proxy the player-facing endpoints to the admin server (port 7401).
        # Auth-protected (only signed-in viewers can heartbeat / poll state).
        location /api/streamstate {
            include /etc/nginx/conf.d/http-auth-check.conf;
            proxy_pass http://127.0.0.1:7401/api/streamstate;
            proxy_set_header X-Forwarded-For $remote_addr;
            access_log off;
        }
        location /api/heartbeat {
            include /etc/nginx/conf.d/http-auth-check.conf;
            proxy_pass http://127.0.0.1:7401/api/heartbeat;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_pass_request_headers on;
            access_log off;
        }

        # Auth-protected: player UI (default = watch.html, no lobby).
        location / {
            include /etc/nginx/conf.d/http-auth-check.conf;
            root /var/www/html;
            index watch.html;
            try_files $uri /watch.html;
            # Always revalidate static assets so JS/CSS updates land on
            # next reload (the in-flight release cycle changes endpoints
            # frequently and stale clients break things).
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
    }
}
