worker_processes  auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

events {
    worker_connections 1024;
}

# ----------------------------------------------------------------------------
# RTMP — single-stream model.
#   live  : OBS publishes to rtmp://host:1935/live/<STREAM_KEY>. Auth + relay.
#   show  : private (127.0.0.1 only). HLS is generated here at fixed name(s).
# ----------------------------------------------------------------------------
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        ping 30s;
        notify_method get;

        # OBS connects here. The key is validated; on success the stream is
        # either pushed (no transcode) or transcoded (ABR) into /show/stream*.
        application live {
            live on;
            record off;

            include /etc/nginx/conf.d/rtmp-auth.conf;
            include /etc/nginx/conf.d/live-relay.conf;

            # /live never serves HLS to viewers and never accepts plays.
            deny play all;
        }

        # Internal application — receives the relayed stream and produces HLS.
        # Only the local ffmpeg/push relay is allowed to publish here.
        application show {
            live on;
            record off;

            include /etc/nginx/conf.d/show-hls.conf;

            allow publish 127.0.0.1;
            deny publish all;
            allow play all;
        }
    }
}

# ----------------------------------------------------------------------------
# HTTP — player UI, HLS delivery, login, health.
# ----------------------------------------------------------------------------
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Critical when behind a port mapping (Unraid host port != container port)
    # or a reverse proxy / Cloudflare Tunnel. Without this nginx 302s to
    # http://<host>:8080/ instead of preserving the public host:port.
    absolute_redirect off;
    port_in_redirect off;

    map $sent_http_content_type $cors_origin {
        default "";
        ~*application/vnd\.apple\.mpegurl "*";
        ~*video/mp2t "*";
    }

    # Auth cookie -> $authed (1 = ok, 0 = redirect to /login.html).
    include /etc/nginx/conf.d/http-auth-map.conf;

    server {
        listen 8080 default_server;
        server_name _;

        access_log /var/log/nginx/access.log;

        # Always-open: docker healthcheck.
        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Always-open: nginx-rtmp on_publish callback (loopback only).
        location /auth/publish {
            include /etc/nginx/conf.d/keys.conf;
            access_log off;
        }

        # Always-open: /login.html, /icon.svg, /auth/login, /auth/logout.
        # entrypoint writes this when VIEWER_PASSWORD is set; empty otherwise
        # (in which case those paths fall through to the catch-all `location /`).
        include /etc/nginx/conf.d/http-login-route.conf;

        # Auth-protected: /api/config (JSON the player reads for the title).
        location = /api/config {
            include /etc/nginx/conf.d/http-auth-check.conf;
            include /etc/nginx/conf.d/http-config.conf;
        }

        # Auth-protected: ABR master playlist (only present when ABR is on).
        include /etc/nginx/conf.d/http-abr.conf;

        # Auth-protected: HLS playlists + segments.
        location /hls/ {
            include /etc/nginx/conf.d/http-auth-check.conf;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var/lib/nginx;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin "$cors_origin" always;
        }

        # Auth-protected: nginx-rtmp stat XML (handy for debugging).
        location /stat {
            include /etc/nginx/conf.d/http-auth-check.conf;
            rtmp_stat all;
            access_log off;
            add_header Cache-Control no-cache;
        }

        # Auth-protected: player UI (default = watch.html, no lobby).
        location / {
            include /etc/nginx/conf.d/http-auth-check.conf;
            root /var/www/html;
            index watch.html;
            try_files $uri /watch.html;
        }
    }
}
