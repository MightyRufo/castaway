worker_processes  auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

events {
    worker_connections 1024;
}

# ----------------------------------------------------------------------------
# RTMP — OBS publishes to /live/<name>. If ABR is enabled (entrypoint
# generated rtmp-abr.conf), ffmpeg fans the stream out to /stream/<name>_<q>.
# ----------------------------------------------------------------------------
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        ping 30s;
        notify_method get;

        # Source application — OBS publishes here. HLS is generated here only
        # when ABR is OFF (entrypoint writes live-hls.conf accordingly).
        application live {
            live on;
            record off;

            include /etc/nginx/conf.d/rtmp-auth.conf;
            include /etc/nginx/conf.d/rtmp-abr.conf;
            include /etc/nginx/conf.d/live-hls.conf;

            allow play all;
        }

        # Variant application — only fed by ffmpeg when ABR is ON. Per-variant
        # HLS is generated here (entrypoint writes stream-hls.conf accordingly).
        application stream {
            live on;
            record off;

            include /etc/nginx/conf.d/stream-hls.conf;

            # Variants are local-only — only ffmpeg should publish here.
            allow publish 127.0.0.1;
            deny publish all;
            allow play all;
        }
    }
}

# ----------------------------------------------------------------------------
# HTTP — player UI, HLS delivery, health, stat, optional auth callback,
# optional ABR master playlist.
# ----------------------------------------------------------------------------
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    map $sent_http_content_type $cors_origin {
        default "";
        ~*application/vnd\.apple\.mpegurl "*";
        ~*video/mp2t "*";
    }

    # Auth cookie -> $authed (1 = ok, 0 = redirect to /login.html).
    # entrypoint writes this with the per-boot random token.
    include /etc/nginx/conf.d/http-auth-map.conf;

    server {
        listen 8080 default_server;
        server_name _;

        access_log /var/log/nginx/access.log;

        # /health is always open — used by docker healthcheck and external monitors.
        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Internal auth check for stream-key publishing — always open
        # (only reachable from inside the container via 127.0.0.1).
        location /auth/publish {
            include /etc/nginx/conf.d/keys.conf;
            access_log off;
        }

        # /login.html, /icon.svg, /auth/login, /auth/logout — must be reachable
        # without the auth cookie. entrypoint writes this snippet only when
        # VIEWER_PASSWORD is set; otherwise it's empty and these routes fall
        # through to the catch-all `location /` block below.
        include /etc/nginx/conf.d/http-login-route.conf;

        # ABR master playlist (only matched when ABR is enabled).
        include /etc/nginx/conf.d/http-abr.conf;

        # HLS playlists + segments — auth-protected.
        location /hls/ {
            include /etc/nginx/conf.d/http-auth-check.conf;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var/lib/nginx;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin "$cors_origin" always;
        }

        # nginx-rtmp stat XML — auth-protected (lobby reads from it).
        location /stat {
            include /etc/nginx/conf.d/http-auth-check.conf;
            rtmp_stat all;
            access_log off;
            add_header Cache-Control no-cache;
        }

        # Player UI — auth-protected.
        location / {
            include /etc/nginx/conf.d/http-auth-check.conf;
            root /var/www/html;
            index index.html;
        }
    }
}
