worker_processes  auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

events {
    worker_connections 1024;
}

# ----------------------------------------------------------------------------
# RTMP — OBS publishes here, HLS is generated from the live stream.
# ----------------------------------------------------------------------------
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        ping 30s;
        notify_method get;

        application live {
            live on;
            record off;

            # Optional stream-key validation.
            # entrypoint.sh writes /etc/nginx/conf.d/rtmp-auth.conf based on STREAM_KEYS.
            include /etc/nginx/conf.d/rtmp-auth.conf;

            # HLS for browser playback.
            hls on;
            hls_path /var/lib/nginx/hls;
            hls_fragment 2s;
            hls_playlist_length 8s;
            hls_cleanup on;
            hls_nested off;

            allow play all;
        }
    }
}

# ----------------------------------------------------------------------------
# HTTP — player UI, HLS delivery, health, stat, optional auth callback.
# ----------------------------------------------------------------------------
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    server_tokens off;

    map $sent_http_content_type $cors_origin {
        default "";
        ~*application/vnd\.apple\.mpegurl "*";
        ~*video/mp2t "*";
    }

    server {
        listen 8080 default_server;
        server_name _;

        access_log /var/log/nginx/access.log;

        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /var/lib/nginx;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin "$cors_origin" always;
        }

        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            access_log off;
        }
        location /stat.xsl {
            root /var/www/html;
        }

        # Internal auth check — entrypoint writes /etc/nginx/conf.d/keys.conf
        # with `if ($arg_name = "<key>") { return 200; }` for each STREAM_KEYS entry.
        location /auth/publish {
            include /etc/nginx/conf.d/keys.conf;
            access_log off;
        }

        location / {
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
